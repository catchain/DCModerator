# Все тексты сообщений бота. Редактируй свободно.
#
# Плейсхолдеры в фигурных скобках подставляются автоматически, например:
#   "Пользователь {user} получил варн ({count}/{limit})"
# Доступные плейсхолдеры указаны в комментарии рядом с каждой строкой.
#
# {user}   — упоминание/имя нарушителя
# {count}  — текущее число варнов
# {limit}  — лимит варнов
# {reason} — причина
# и т.д.

# --- Варны ---
warn:
  # {user} {count} {limit} {reason}
  issued: "⚠️ {user} предупреждение ({count}/{limit}). Причина: {reason}"
  # /warns — список варнов пользователя. {user} {count} {limit}
  status: "📋 У {user} предупреждений: {count}/{limit}"
  # /warns без reply
  need_reply: "Команду нужно отправить ответом (reply) на сообщение пользователя."
  # /unwarn
  cleared: "✅ Предупреждения сняты с {user}."

# --- Причины удаления (используются как {reason} в варнах и в логах) ---
reason:
  stopword: "подозрение на спам"
  link_newbie: "подозрение на спам"
  link_blacklist: "спам"
  via_bot: "спам"
  inline_buttons: "сообщение с кнопками"
  flood: "флуд ({minutes} мин.)"
  warn_limit: "лимит предупреждений ({hours} ч.)"
  ai: "AI-модерация: {category}"

# --- Команда /top ---
top:
  # {period} — человекочитаемый период (например, "7 дней")
  title: "🏆 Топ-10 активных за {period}:"
  # {rank} {user} {count}
  line: "{rank}. {user} — {count}"
  empty: "За выбранный период сообщений нет."
  invalid_period: "Неверный период. Используй: /top 1d | /top 7d | /top 30d"
  period_1d: "1 день"
  period_7d: "7 дней"
  period_30d: "30 дней"

# --- Служебные / админские команды ---
common:
  no_username: "без_имени"
  admins_only: "Команда доступна только администраторам."
  group_only: "Команда работает только в модерируемом чате."
reload:
  done: "♻️ Списки перезагружены: стоп-слов {stopwords}, чёрный список {blacklist}, белый {whitelist}."

# --- Лог-канал (формат записей действий модерации) ---
log:
  # {action} {user} {chat} {reason} {text}
  entry: "<b>{action}</b>\nПользователь: {user}\nПричина: {reason}\nТекст: <code>{text}</code>"
  action_delete: "Удалено сообщение"
  action_warn: "⚠️ Предупреждение"
  action_mute: "🔇 Мут"
  action_ban: "⛔️ Бан"
  button_ban: "⛔️BAN"
  button_cancel: "Отмена"
  banned_from_log: "Забанен из лога"
  cancelled_from_log: "Предупреждение отменено"
